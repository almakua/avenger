# Avenger configuration
# copy to ~/.config/avenger/config.yaml (or $AVENGER_CONFIG_DIR/config.yaml)
# changes are picked up when you save the file from Avenger or switch back to the app

# any installed font; monospaced fonts work best
font: Menlo
font_size: 14

# built-in: mocha (default), macchiato, frappe, latte ("catppuccin-" prefix optional)
# anything else loads ~/.config/avenger/themes/<name>.yaml
theme: mocha

# spaces per tab stop, also used by the Tab key (1..16)
tab_width: 4

# tmux-style prefix key: press it, then one of the keys below
# modifiers: C- control, M-/A- option, D- command, S- shift; names: space tab enter esc
# left right up down home end pageup pagedown delete backspace
prefix: C-s

# keys pressed after the prefix; an empty value unbinds an action
# defaults: new_tab c, close_tab x, next_tab n, prev_tab p, last_tab l, open o,
# open_config ",", save s, next_theme t, tab_1..tab_9 1..9
# command+1..9 and the menu shortcuts work without the prefix
keys:
  new_tab: c
  close_tab: x
